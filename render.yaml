services:
  - type: web
    name: andrei-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: MODEL_NAME
        value: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - key: USE_4BIT
        value: "false"  # Set "true" if using paid tier with GPU
      - key: MAX_MEMORY
        value: "50"
    healthCheckPath: /health
